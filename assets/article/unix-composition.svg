<text x="78" y="25" fill="#8fa99a" font-size="14" font-family="Menlo,Monaco,monospace">unix / composability</text>
<text x="34" y="77" fill="#b8dfc8" font-size="19" font-family="Menlo,Monaco,monospace">$ cat philosophy.txt</text>
<text x="34" y="116" fill="#78b993" font-size="16" font-family="Menlo,Monaco,monospace">input.txt</text>
