<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc"><title id="title">Smart card as a FIDO2 authenticator</title><desc id="desc">Technical terminal illustration showing a card and reader with FIDO2 challenge-response status</desc><rect width="900" height="360" rx="10" fill="#0a1110"/><rect x="1" y="1" width="898" height="358" rx="9" fill="none" stroke="#2c5546" stroke-width="2"/><rect x="0" y="0" width="900" height="44" rx="9" fill="#12211c"/><circle cx="22" cy="22" r="5" fill="#53d99c"/><text x="40" y="28" fill="#a7c7b6" font-family="monospace" font-size="15">identity@terminal:~$ fido2 credential status</text><g font-family="monospace" font-size="17" fill="#d5e4dc"><text x="45" y="95" fill="#60dfa5">$</text><text x="65" y="95">authenticator --type card</text><text x="45" y="135">protocol:</text><text x="185" y="135" fill="#69e8ab">FIDO2 / CTAP2</text><text x="45" y="170">transport:</text><text x="185" y="170" fill="#d5e4dc">reader</text><text x="45" y="205">credential:</text><text x="185" y="205" fill="#d5e4dc">device-bound</text><text x="45" y="240">challenge:</text><text x="185" y="240" fill="#69e8ab">signed</text><text x="45" y="275">RP binding:</text><text x="185" y="275" fill="#69e8ab">verified</text><text x="45" y="325" fill="#60dfa5">&gt;</text><rect x="65" y="309" width="11" height="20" fill="#60dfa5"/></g><g transform="translate(532 72)">
