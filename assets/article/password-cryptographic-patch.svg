<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-labelledby="t d"><title id="t">From shared secrets to cryptographic proof</title><desc id="d">Two terminal-style panels compare a reusable password with a FIDO signed challenge.</desc><rect width="960" height="280" rx="12" fill="#0b1512"/><rect x="16" y="18" width="450" height="242" rx="8" fill="#101c17" stroke="#456053"/><rect x="494" y="18" width="450" height="242" rx="8" fill="#101c17" stroke="#456053"/><g font-family="monospace" font-size="18"><text x="36" y="54" fill="#e4b6a4">$ password-login</text><text x="36" y="94" fill="#c8d7ce">user -- secret --&gt; server</text><text x="36" y="130" fill="#c8d7ce">        |</text><text x="36" y="166" fill="#e4b6a4">reusable / phishable</text><text x="36" y="207" fill="#c8d7ce">server stores verifier</text><text x="514" y="54" fill="#69dba3">$ fido2-authenticate</text><text x="514" y="94" fill="#c8d7ce">RP -- challenge --&gt; key</text><text x="514" y="130" fill="#c8d7ce">       signed proof</text><text x="514" y="166" fill="#69dba3">origin + RP ID bound</text><text x="514" y="207" fill="#c8d7ce">server holds public key</text></g><text x="36" y="242" font-family="monospace" font-size="13" fill="#819e8d">SHARED SECRET</text><text x="514" y="242" font-family="monospace" font-size="13" fill="#819e8d">ASYMMETRIC CRYPTOGRAPHY</text></svg>
