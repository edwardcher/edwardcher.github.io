<text x="78" y="25" fill="#8fa99a" font-size="14" font-family="Menlo,Monaco,monospace">terminal-first / five principles</text>
<text x="34" y="77" fill="#b8dfc8" font-size="19" font-family="Menlo,Monaco,monospace">$ cat principles.txt</text>
<text x="34" y="116" fill="#78b993" font-size="16" font-family="Menlo,Monaco,monospace">01 productivity</text>
<text x="330" y="116" fill="#d0d8d2" font-size="16" font-family="Menlo,Monaco,monospace">less navigation overhead</text>
<text x="34" y="149" fill="#78b993" font-size="16" font-family="Menlo,Monaco,monospace">02 acceleration</text>
<text x="330" y="149" fill="#d0d8d2" font-size="16" font-family="Menlo,Monaco,monospace">shorter idea-to-result loop</text>
<text x="34" y="182" fill="#78b993" font-size="16" font-family="Menlo,Monaco,monospace">03 focus</text>
<text x="330" y="182" fill="#d0d8d2" font-size="16" font-family="Menlo,Monaco,monospace">fewer context switches</text>
<text x="34" y="215" fill="#78b993" font-size="16" font-family="Menlo,Monaco,monospace">04 automation</text>
<text x="330" y="215" fill="#d0d8d2" font-size="16" font-family="Menlo,Monaco,monospace">repeatable operations</text>
<text x="34" y="248" fill="#78b993" font-size="16" font-family="Menlo,Monaco,monospace">05 canonicality</text>
<text x="330" y="248" fill="#d0d8d2" font-size="16" font-family="Menlo,Monaco,monospace">one authoritative source</text>
